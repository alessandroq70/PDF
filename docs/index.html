<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unisci PDF (online)</title>
  <style>
:root {
  --bg: #f3f4f6;
  --card-bg: #ffffff;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #d1d5db;
  --danger: #dc2626;
  --success: #16a34a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.card {
  background: var(--card-bg);
  width: 100%;
  max-width: 560px;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

h1 { margin: 0 0 4px; font-size: 1.6rem; }

.subtitle { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }

.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 32px;
  border: 2px dashed var(--border);
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}

.dropzone:hover,
.dropzone.dragover { border-color: var(--primary); background: #eff6ff; }

.dropzone-icon { font-size: 2rem; }
.dropzone-text { color: var(--muted); }

.file-list { list-style: none; margin: 20px 0 0; padding: 0; }

.file-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 8px;
  background: #fafafa;
}

.file-index {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.file-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-size { flex: 0 0 auto; color: var(--muted); font-size: 0.82rem; }

.icon-btn {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 1rem;
  padding: 4px 6px;
  border-radius: 6px;
  color: var(--muted);
}

.icon-btn:hover:not(:disabled) { background: #e5e7eb; color: var(--text); }
.icon-btn:disabled { opacity: 0.3; cursor: default; }

.actions { display: flex; gap: 12px; margin-top: 24px; }

.btn {
  flex: 1;
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}

.btn:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-secondary { background: #e5e7eb; color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: #d1d5db; }

.status { margin: 16px 0 0; min-height: 1.2em; font-size: 0.9rem; text-align: center; }
.status.error { color: var(--danger); }
.status.success { color: var(--success); }
.status.busy { color: var(--muted); }

.hint { margin: 12px 0 0; font-size: 0.8rem; color: var(--muted); text-align: center; }
  </style>
  <!-- pdf-lib: unione dei PDF interamente nel browser, nessun server -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>📎 Unisci PDF</h1>
    <p class="subtitle">Seleziona 2 o più file PDF, mettili nell'ordine desiderato e uniscili in un unico documento — tutto nel tuo browser.</p>

    <label for="file-input" class="dropzone" id="dropzone">
      <span class="dropzone-icon">⬆️</span>
      <span class="dropzone-text">Clicca per scegliere i PDF<br /><small>oppure trascinali qui</small></span>
      <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden />
    </label>

    <ul id="file-list" class="file-list" aria-live="polite"></ul>

    <div class="actions">
      <button type="button" id="clear-btn" class="btn btn-secondary" disabled>Svuota</button>
      <button type="button" id="merge-btn" class="btn btn-primary" disabled>Unisci e salva</button>
    </div>

    <p id="status" class="status" role="status"></p>
    <p class="hint">🔒 I file restano sul tuo dispositivo: nulla viene caricato online.</p>
  </main>

  <script>
"use strict";

// ---------------------------------------------------------------------------
// "Unisci PDF" — versione 100% browser, basata su pdf-lib.
// I PDF vengono uniti localmente nel browser: nessun server, nessun upload.
// ---------------------------------------------------------------------------

const { PDFDocument } = PDFLib;

let files = []; // PDFs in merge order

const fileInput = document.getElementById("file-input");
const dropzone = document.getElementById("dropzone");
const fileListEl = document.getElementById("file-list");
const mergeBtn = document.getElementById("merge-btn");
const clearBtn = document.getElementById("clear-btn");
const statusEl = document.getElementById("status");

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function setStatus(message, kind) {
  statusEl.textContent = message || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}

function isPdf(file) {
  return file.type === "application/pdf" || /\.pdf$/i.test(file.name);
}

function addFiles(fileListLike) {
  const incoming = Array.from(fileListLike);
  let skipped = 0;
  for (const file of incoming) {
    if (!isPdf(file)) { skipped++; continue; }
    const duplicate = files.some((f) => f.name === file.name && f.size === file.size);
    if (!duplicate) files.push(file);
  }
  render();
  setStatus(skipped > 0 ? `${skipped} file ignorato/i perché non è un PDF.` : "", skipped > 0 ? "error" : "");
}

function removeAt(index) { files.splice(index, 1); render(); }

function move(index, delta) {
  const target = index + delta;
  if (target < 0 || target >= files.length) return;
  [files[index], files[target]] = [files[target], files[index]];
  render();
}

function render() {
  fileListEl.innerHTML = "";
  files.forEach((file, i) => {
    const li = document.createElement("li");
    li.className = "file-item";
    li.innerHTML = `
      <span class="file-index">${i + 1}</span>
      <span class="file-name" title="${file.name}">${file.name}</span>
      <span class="file-size">${formatSize(file.size)}</span>
      <button class="icon-btn" data-act="up" ${i === 0 ? "disabled" : ""} title="Sposta su">▲</button>
      <button class="icon-btn" data-act="down" ${i === files.length - 1 ? "disabled" : ""} title="Sposta giù">▼</button>
      <button class="icon-btn" data-act="remove" title="Rimuovi">✕</button>
    `;
    li.querySelector('[data-act="up"]').addEventListener("click", () => move(i, -1));
    li.querySelector('[data-act="down"]').addEventListener("click", () => move(i, 1));
    li.querySelector('[data-act="remove"]').addEventListener("click", () => removeAt(i));
    fileListEl.appendChild(li);
  });
  mergeBtn.disabled = files.length < 2;
  clearBtn.disabled = files.length === 0;
}

fileInput.addEventListener("change", (e) => { addFiles(e.target.files); fileInput.value = ""; });

["dragenter", "dragover"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("dragover"); })
);
["dragleave", "drop"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("dragover"); })
);
dropzone.addEventListener("drop", (e) => {
  if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
});

clearBtn.addEventListener("click", () => { files = []; render(); setStatus(""); });

async function saveBlob(blob) {
  if (typeof window.showSaveFilePicker === "function") {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "documenti-uniti.pdf",
        types: [{ description: "PDF", accept: { "application/pdf": [".pdf"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return "saved";
    } catch (err) {
      if (err && err.name === "AbortError") return "cancelled";
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "documenti-uniti.pdf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  return "downloaded";
}

mergeBtn.addEventListener("click", async () => {
  if (files.length < 2) { setStatus("Seleziona almeno 2 file PDF.", "error"); return; }

  mergeBtn.disabled = true;
  clearBtn.disabled = true;
  setStatus("Unione in corso…", "busy");

  try {
    const merged = await PDFDocument.create();
    for (const file of files) {
      const bytes = await file.arrayBuffer();
      let src;
      try {
        src = await PDFDocument.load(bytes, { ignoreEncryption: true });
      } catch (_) {
        throw new Error(`"${file.name}" non è un PDF valido o è protetto.`);
      }
      const pages = await merged.copyPages(src, src.getPageIndices());
      pages.forEach((p) => merged.addPage(p));
    }

    const out = await merged.save();
    const blob = new Blob([out], { type: "application/pdf" });

    const result = await saveBlob(blob);
    if (result === "cancelled") setStatus("Salvataggio annullato.", "");
    else if (result === "saved") setStatus("✓ PDF salvato nella posizione scelta.", "success");
    else setStatus("✓ PDF pronto: controlla la cartella Download.", "success");
  } catch (err) {
    console.error(err);
    setStatus("Errore durante l'unione: " + (err && err.message ? err.message : "riprova."), "error");
  } finally {
    render();
  }
});

render();
  </script>
</body>
</html>
